name: pos_mobile
description: Sajia cashier and F&B operations app
publish_to: 'none'
version: 1.0.16+2017

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  drift: ^2.34.0
  path_provider: ^2.1.3
  package_info_plus: ^10.2.0
  path: ^1.9.0
  supabase_flutter: ^2.14.2
  connectivity_plus: ^7.1.1
  go_router: ^17.3.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  webview_flutter: ^4.14.0
  esc_pos_utils_plus: ^2.0.4
  pdf: ^3.11.0
  printing: ^5.13.0
  intl: ^0.20.2
  crypto: ^3.0.7
  uuid: ^4.4.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  csv: ^8.0.0
  flutter_local_notifications: ^22.0.1
  print_bluetooth_thermal: ^1.2.1
  share_plus: ^13.1.0
  file_selector: ^1.0.3
  pointycastle: ^4.0.0
  flutter_secure_storage: ^10.3.1
  sqlite3: ^3.3.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
