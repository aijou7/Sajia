name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test --dart-define=KASATA_VISUAL_REVIEW=true

      - name: Verify ingredient inventory in disposable PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/ingredient-inventory-tests" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/ingredient-inventory-tests/node_modules" node scripts/verify_ingredient_inventory.cjs

      - name: Save UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kasata-ui-review
          path: build/visual-review
          if-no-files-found: ignore
          retention-days: 7
