name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/sajia-github-beta.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=sajia-github-beta.jks\n'
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build direct-download ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          versioned_apk="Sajia-v${version}-arm64.apk"
          latest_apk="Sajia-latest-arm64.apk"

          cp "$source_apk" "$versioned_apk"
          cp "$source_apk" "$latest_apk"
          sha256sum "$versioned_apk" > "${versioned_apk}.sha256"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "$versioned_apk"
          "$aapt_path" dump badging "$versioned_apk" | head -n 3

          echo "versioned_apk=$versioned_apk" >> "$GITHUB_OUTPUT"
          echo "latest_apk=$latest_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=${versioned_apk}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_APK: ${{ steps.package.outputs.versioned_apk }}
          LATEST_APK: ${{ steps.package.outputs.latest_apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          notes_file="RELEASE_NOTES_V${GITHUB_REF_NAME#v}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$VERSIONED_APK" "$LATEST_APK" "$CHECKSUM" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Sajia ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "$VERSIONED_APK" "$LATEST_APK" "$CHECKSUM" \
              --title "Sajia ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --latest
          fi
