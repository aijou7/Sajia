name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/sajia-github-beta.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=sajia-github-beta.jks\n'
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build direct-download APKs for 32-bit and 64-bit Android
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_v7a="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          source_v8a="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          versioned_v7a="Sajia-v${version}-v7a.apk"
          latest_v7a="Sajia-latest-v7a.apk"
          versioned_v8a="Sajia-v${version}-v8a.apk"
          latest_v8a="Sajia-latest-v8a.apk"

          cp "$source_v7a" "$versioned_v7a"
          cp "$source_v7a" "$latest_v7a"
          cp "$source_v8a" "$versioned_v8a"
          cp "$source_v8a" "$latest_v8a"
          sha256sum "$versioned_v7a" > "${versioned_v7a}.sha256"
          sha256sum "$versioned_v8a" > "${versioned_v8a}.sha256"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "$versioned_v7a"
          "$apksigner_path" verify --verbose --print-certs "$versioned_v8a"
          v7a_native_code="$("$aapt_path" dump badging "$versioned_v7a" | sed -n "s/^native-code: //p")"
          v8a_native_code="$("$aapt_path" dump badging "$versioned_v8a" | sed -n "s/^native-code: //p")"
          echo "v7a native-code: $v7a_native_code"
          echo "v8a native-code: $v8a_native_code"
          [[ "$v7a_native_code" == *"'armeabi-v7a'"* ]]
          [[ "$v7a_native_code" != *"'arm64-v8a'"* ]]
          [[ "$v8a_native_code" == *"'arm64-v8a'"* ]]
          [[ "$v8a_native_code" != *"'armeabi-v7a'"* ]]

          echo "versioned_v7a=$versioned_v7a" >> "$GITHUB_OUTPUT"
          echo "latest_v7a=$latest_v7a" >> "$GITHUB_OUTPUT"
          echo "checksum_v7a=${versioned_v7a}.sha256" >> "$GITHUB_OUTPUT"
          echo "versioned_v8a=$versioned_v8a" >> "$GITHUB_OUTPUT"
          echo "latest_v8a=$latest_v8a" >> "$GITHUB_OUTPUT"
          echo "checksum_v8a=${versioned_v8a}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_V7A: ${{ steps.package.outputs.versioned_v7a }}
          LATEST_V7A: ${{ steps.package.outputs.latest_v7a }}
          CHECKSUM_V7A: ${{ steps.package.outputs.checksum_v7a }}
          VERSIONED_V8A: ${{ steps.package.outputs.versioned_v8a }}
          LATEST_V8A: ${{ steps.package.outputs.latest_v8a }}
          CHECKSUM_V8A: ${{ steps.package.outputs.checksum_v8a }}
        run: |
          set -euo pipefail
          notes_file="RELEASE_NOTES_V${GITHUB_REF_NAME#v}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$VERSIONED_V7A" "$LATEST_V7A" "$CHECKSUM_V7A" \
              "$VERSIONED_V8A" "$LATEST_V8A" "$CHECKSUM_V8A" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Sajia ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              "$VERSIONED_V7A" "$LATEST_V7A" "$CHECKSUM_V7A" \
              "$VERSIONED_V8A" "$LATEST_V8A" "$CHECKSUM_V8A" \
              --title "Sajia ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --latest
          fi
