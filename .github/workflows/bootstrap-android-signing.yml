name: Bootstrap Android Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Sajia GitHub beta signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-bootstrap
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          key_alias="sajia_github_beta"

          keytool -genkeypair \
            -keystore signing-bootstrap/sajia-github-beta.jks \
            -storepass "$store_password" \
            -alias "$key_alias" \
            -keypass "$key_password" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Sajia GitHub Beta, OU=Mobile, O=Aijou Teknologi Digital, L=Indonesia, C=ID"

          jq -n \
            --arg storePassword "$store_password" \
            --arg keyPassword "$key_password" \
            --arg keyAlias "$key_alias" \
            '{storePassword: $storePassword, keyPassword: $keyPassword, keyAlias: $keyAlias}' \
            > signing-bootstrap/credentials.json

          keytool -list -v \
            -keystore signing-bootstrap/sajia-github-beta.jks \
            -storepass "$store_password" \
            -alias "$key_alias" \
            | grep -E "Alias name:|SHA256:|Valid from:"

      - name: Upload one-time signing bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sajia-signing-bootstrap
          path: signing-bootstrap/
          if-no-files-found: error
          retention-days: 1

